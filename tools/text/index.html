<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Yazı · Oktos Workshop</title>
<meta name="description" content="Kapı plakası, masa tabelası, pasta süsü, buzdolabı mıknatısı ve anahtarlık: kendi yazınla 3B baskı. Tarayıcıda tasarla, Oktos basıp göndersin.">
<meta name="theme-color" content="#eaedeb">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Oktos Workshop">
<meta property="og:title" content="3D Yazı · Oktos Workshop">
<meta property="og:description" content="Kapı plakası, masa tabelası, pasta süsü, buzdolabı mıknatısı ve anahtarlık: kendi yazınla 3B baskı. Tarayıcıda tasarla, Oktos basıp göndersin.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="../../core/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../core/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/",
  "manifold-3d": "https://cdn.jsdelivr.net/npm/manifold-3d@2.5.1/manifold.js",
  "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/index.js",
  "opentype": "https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.module.js"
} }
</script>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.min.js" crossorigin>
<script>
  // Modül ya da kütüphane yüklenemezse sayfa sessizce boş kalmasın.
  (function () {
    function fail() { var e = document.getElementById('err'); if (e) { e.hidden = false; } var b = document.getElementById('busy'); if (b) b.classList.remove('on'); }
    window.addEventListener('error', function (ev) { var t = ev.target; if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) fail(); }, true);
    window.addEventListener('unhandledrejection', function () { if (!window.__oktosReady) fail(); });
    setTimeout(function () { if (!window.__oktosReady) fail(); }, 25000);
  })();
</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../../index.html"><img src="../../core/icon.svg" alt="" width="26" height="26"><span data-i18n="app.name">Oktos Workshop</span></a>
  <span class="crumb" aria-hidden="true">/ <b data-i18n="text.title">3D Yazı</b></span>
  <span class="spacer"></span>
  <div class="lang" role="group" aria-label="Dil / Language"><button type="button" data-lang="tr" aria-pressed="true">TR</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
</header>

<main class="tool">
  <div class="stage" id="stage">
    <div class="hud" id="hud"></div>
    <div class="busy" id="busy" aria-hidden="true"></div>
    <div class="err" id="err" role="alert" hidden data-i18n="common.bootError">Atölye yüklenemedi. Bağlantını kontrol edip sayfayı yenile.</div>
    <div class="viewbar" id="viewbar" role="group" aria-label="Görünüm">
      <button type="button" data-view="iso" data-i18n="view.iso">İzometrik</button>
      <button type="button" data-view="top" data-i18n="view.top">Üst</button>
      <button type="button" data-view="front" data-i18n="view.front">Ön</button>
      <button type="button" data-view="right" data-i18n="view.right">Sağ</button>
      <span class="sep"></span>
      <button type="button" data-view="fit" data-i18n="view.fit">Sığdır</button>
    </div>
  </div>

  <aside class="side">
    <div class="side-scroll">
      <h1 class="tool-title" tabindex="-1" data-i18n="text.title">3D Yazı</h1>
      <p class="lede" data-i18n="text.lede">Kapı plakası, masa tabelası, pasta süsü, mıknatıs, anahtarlık. Yazını yaz, biçimini seç, sipariş ver.</p>
      <div class="modes" id="modes" role="group" aria-label="Mod"></div>
      <div id="presets"></div>
      <div id="panel"></div>
      <ul class="notes" id="notes" role="status"></ul>
    </div>
    <div class="actions">
      <button type="button" class="btn primary wide" id="hazir" data-i18n="common.ready" disabled>Hazır</button>
      <button type="button" class="btn primary wide" id="order" data-i18n="common.order" disabled hidden>Sipariş ver</button>
      <p class="order-meta" id="order-meta" hidden></p>
      <button type="button" class="btn ghost" id="share" data-i18n="common.share" disabled>Bağlantıyı kopyala</button>
      <div class="share-fallback wide" id="share-fallback" hidden><input type="text" readonly aria-label="Tasarım bağlantısı"></div>
      <div class="exports wide" id="exports" hidden>
        <span data-i18n="common.workshopExport">Atölye: dışa aktar</span>
        <button type="button" class="btn" id="dl-3mf" data-i18n="common.download3MF" disabled>3MF indir</button>
      </div>
    </div>
  </aside>
</main>
<p class="sr-only" id="sr-status" role="status" aria-live="polite"></p>

<script type="module">
  import { bootTool } from '../../core/page.js';
  import { TOOL } from './app.js';
  bootTool({ tool: TOOL }).catch((e) => { console.error(e); document.getElementById('err').hidden = false; document.getElementById('busy').classList.remove('on'); });
</script>
</body>
</html>
