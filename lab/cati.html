<!doctype html>
<html lang="tr" class="story-on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çatı Katı Laboratuvarı · Oktos Workshop</title>
<meta name="robots" content="noindex">
<meta name="description" content="Oktos Workshop'un çatı katı: İbrahim Arda Bişgin'in portfolyosu. Fikir rafında kutu oyunları, plakalar, figürler, anahtarlıklar, stant ve vitrinler, ev ürünleri ve endüstriyel ön-mühendislik; dijital modelden döküme üretim süreci.">
<meta name="theme-color" content="#d5d8dc">
<link rel="icon" href="../core/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../core/style.css">
<link rel="stylesheet" href="../core/story.css">
<link rel="stylesheet" href="../core/oda.css">
<link rel="stylesheet" href="../core/cati.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/",
  "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/index.js",
  "gsap/": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/"
} }
</script>
<noscript><style>.story { display: none !important; } .cati-noscript { color: #ece8e1; background: #15171a; }</style></noscript>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../index.html"><img src="../core/logo-beyaz.svg" alt="" width="36" height="28"><span>Oktos Workshop</span></a>
  <span class="spacer"></span>
  <button type="button" class="cati-liste-ac" id="liste-ac" hidden>Listeyi göster</button>
  <div class="lang" role="group" aria-label="Dil / Language"><button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button></div>
</header>

<section class="story oda cati" id="story" aria-labelledby="story-title">
  <div class="story-canvas"></div>
  <div class="oda-scrim" aria-hidden="true"></div>
  <div class="story-pins"></div>
  <div class="story-copy">
    <h1 class="story-title" id="story-title">3B bir fikrin var mı? Gerçeğe dönüştürelim.</h1>
    <p class="story-lede"></p>
    <div class="story-actions">
      <button type="button" class="story-cta"></button>
      <span class="story-hint"></span>
    </div>
  </div>
  <nav class="story-strip"></nav>
  <a class="cati-asagi" id="asagi" href="oda.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg><span>Odaya in</span></a>
  <div class="story-veil"><div class="oda-yukle" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div></div>
  <p class="story-live" aria-live="polite"></p>
</section>
<noscript><p class="cati-noscript">Oktos Workshop çatı katı: İbrahim Arda Bişgin'in portfolyosu. Fikir rafı: kutu oyunları, plakalar, figürler (Modern Balbal serisi), anahtarlıklar, stant ve vitrinler, ev ürünleri, endüstriyel ön-mühendislik ve senin fikrin. Dijital modelden döküme sekiz adımlık üretim süreci. Sahne için JavaScript gerekir.</p></noscript>

<script type="module">
  import * as THREE from 'three';
  import { mountStory } from '../core/story.js';
  import * as catiScene from '../core/cati-sahne.js';
  import { CATI_STORY, SAYFA, ALANLAR } from '../core/cati-veri.js';
  import { catiPanel } from '../core/cati-panel.js';
  import { odaTuru } from '../core/oda-tur.js';
  import { getLang, setLang } from '../core/i18n.js';

  const params = new URLSearchParams(location.search);
  if (params.has('cek')) {
    document.head.insertAdjacentHTML('beforeend', '<style>*, *::before, *::after { transition: none !important; }</style>');
    (await import('gsap')).gsap.ticker.lagSmoothing(0);
  }
  const lang = getLang();
  const L = (o) => o[lang] ?? o.tr;
  document.documentElement.lang = lang;
  document.title = L({ tr: 'Çatı Katı Laboratuvarı · Oktos Workshop', en: 'Top Floor Lab · Oktos Workshop' });
  document.querySelectorAll('.lang button').forEach((b) => {
    b.classList.toggle('on', b.dataset.lang === lang);
    b.addEventListener('click', () => { setLang(b.dataset.lang); location.reload(); });
  });
  const root = document.getElementById('story');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || params.get('mod') === 'still';
  // Yükleme perdesi: dosyaların yüklenme oranı (three.js yükleme yöneticisi)
  {
    const veil = root.querySelector('.story-veil'), cubuk = veil.querySelector('.oda-yukle');
    veil.dataset.loading = L(SAYFA.yukleniyor);
    cubuk.setAttribute('aria-label', L(SAYFA.yukleniyor));
    let enCok = 0; // yeni dosya kuyruğa girince oran düşer: çubuk geri gitmesin
    THREE.DefaultLoadingManager.onProgress = (_, y, t) => {
      const p = enCok = Math.max(enCok, 0.06, t ? y / t : 0);
      cubuk.style.setProperty('--ilerleme', p.toFixed(3));
      cubuk.setAttribute('aria-valuenow', String(Math.round(p * 100)));
    };
  }
  const asagi = document.getElementById('asagi');
  asagi.querySelector('span').textContent = L(SAYFA.asagiKat);
  const listeBtn = document.getElementById('liste-ac');
  listeBtn.textContent = L(SAYFA.liste);
  listeBtn.hidden = false;

  catiScene.options.reduce = reduce;
  const panel = catiPanel(root, { lang, reduce });
  listeBtn.addEventListener('click', () => panel.listeAc());
  let tur = null, hazir = false;
  const story = window.story = await mountStory(root, {
    toolId: 'cati', lang, story: CATI_STORY, sceneModule: catiScene,
    ...(params.get('mod') ? { mode: params.get('mod') } : {}),
    onSkip: () => { location.href = '../index.html'; },
    onReady: () => { hazir = true; tur?.hazir(); },
    // Yakın plandaki bölgeye yeniden tıklamak tura değil sahneye gider (Biggie dansı: onPoke)
    onActivate: (h) => (h && h.id === story?.focusedId ? false : (tur?.sec(h) ?? false)),
    onCard: panel.onCard,
  });
  // Kaydırmalı tur: oda içi genel plan, süreç rayı, fikir rafının 8 gözü, pencere köşesi (Biggie), hakkımda, merdiven
  tur = odaTuru(root, story, {
    duraklar: [null, 'surec', ...ALANLAR.map((a) => a.id), 'biggie', 'hakkimda', 'merdiven'],
    metin: { baslik: L(CATI_STORY.name), basla: L(SAYFA.basla) },
    reduce, bekle: !!params.get('odak'),
  });
  if (hazir) tur.hazir();
  root.querySelector('.story-strip').setAttribute('aria-label', L({ tr: 'Çatı katındaki bölümler', en: 'Sections of the top floor' }));
  if (params.get('odak')) story.focus(params.get('odak'));
</script>
</body>
</html>
