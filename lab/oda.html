<!doctype html>
<html lang="tr" class="story-on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oda Laboratuvarı · Oktos Workshop</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111214">
<link rel="icon" href="../core/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../core/style.css">
<link rel="stylesheet" href="../core/story.css">
<link rel="stylesheet" href="../core/oda.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/",
  "manifold-3d": "https://cdn.jsdelivr.net/npm/manifold-3d@2.5.1/manifold.js",
  "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/index.js",
  "gsap/": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/",
  "opentype": "https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.module.js"
} }
</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../index.html"><img src="../core/logo-beyaz.svg" alt="" width="36" height="28"><span>Oktos Workshop</span></a>
  <span class="spacer"></span>
  <div class="lang" role="group" aria-label="Dil / Language"><button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button></div>
</header>

<section class="story oda" id="story" aria-labelledby="story-title">
  <div class="story-canvas"></div>
  <div class="oda-scrim" aria-hidden="true"></div>
  <div class="oda-cue l" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></div>
  <div class="oda-cue r" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></div>
  <div class="story-pins"></div>
  <div class="story-copy">
    <h1 class="story-title" id="story-title"></h1>
    <p class="story-lede"></p>
    <div class="story-actions">
      <button type="button" class="story-cta"></button>
      <span class="story-hint"></span>
    </div>
  </div>
  <nav class="story-strip"></nav>
  <button type="button" class="oda-next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.35-5.65"/><path d="M20 4.5V9h-4.5"/></svg></button>
  <div class="story-veil"></div>
  <p class="story-live" aria-live="polite"></p>
</section>

<script type="module">
  import { mountStory } from '../core/story.js';
  import { ODA_STORY } from '../core/story-data.js';
  import { ZONES } from '../core/oda-yerler.js';
  import * as odaScene from '../core/oda-sahne.js';
  import { odaPanel } from '../core/oda-panel.js';
  import { odaTuru } from '../core/oda-tur.js';
  import { sablonDegeri } from '../core/oda-urunler.js';
  import { t, getLang, setLang } from '../core/i18n.js';

  const params = new URLSearchParams(location.search);
  // ?cek=1 (scripts/sayfa-cek.py çekimleri): görünmez tarayıcıda kareler seyrek çizilir, GSAP her geç kareyi 33 ms sayar
  // ve CSS geçişleri de bitmeden çekim alınır. Çekimde geçişler kapalı, GSAP gerçek zamanla ilerler: son hâl görünür.
  if (params.has('cek')) {
    document.head.insertAdjacentHTML('beforeend', '<style>*, *::before, *::after { transition: none !important; }</style>');
    (await import('gsap')).gsap.ticker.lagSmoothing(0);
  }
  const lang = getLang();
  document.querySelectorAll('.lang button').forEach((b) => {
    b.classList.toggle('on', b.dataset.lang === lang);
    b.addEventListener('click', () => { setLang(b.dataset.lang); location.reload(); });
  });
  const root = document.getElementById('story');
  const nextBtn = document.querySelector('.oda-next');
  nextBtn.setAttribute('aria-label', t('oda.next'));
  nextBtn.title = t('oda.next');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || params.get('mod') === 'still';

  // Tek sahne: fotogerçekçi oda (pişmiş kabuk, gerçek eşyalar). Eski adreslerdeki ?pilot=1 zararsızca yok sayılır.
  odaScene.options.pilot = true;
  // Yakın plan paneli: başlık, cümle, şablon seçici, toz yazısı (core/oda-panel.js)
  const panel = odaPanel(root, { lang, reduce });
  // Denetleyici kendi değişkeninde: kurulmadan önce window.story, id="story" bölümünün kendisidir
  // Kaydırmalı tur (core/oda-tur.js): genel plan, sonra bütün bölgeler ZONES sırasıyla
  let story = null, tur = null, hazir = false;
  story = window.story = await mountStory(root, {
    toolId: 'oda', lang, story: ODA_STORY, sceneModule: odaScene,
    ...(params.get('mod') ? { mode: params.get('mod') } : {}),
    // Ölçü farkı olan şablon (ör. ince uzun kalemlik) araçta birebir açılsın: ölçüler adrese yazılır; diğerleri ?sablon=
    onPick: (preset, h) => {
      const cur = story.api?.current(h.id), v = cur && sablonDegeri(h.id, cur.id);
      const q = v ? new URLSearchParams(Object.entries(v).map(([k, x]) => [k, typeof x === 'object' ? JSON.stringify(x) : String(x)])).toString()
        : `sablon=${encodeURIComponent(preset)}`;
      location.href = `../tools/${cur?.arac || h.tool}/index.html?${q}`; // tepside QR anahtarlık 3D QR aracında
    },
    onSkip: () => { location.href = '../index.html'; },
    // Giriş bitince kamerayı tur sürer; turdayken tıklama önce tura sorulur
    onReady: () => { hazir = true; if (tur) { tur.hazir(); demoBaslat(); } },
    onActivate: (h) => tur?.sec(h) ?? false,
    onCard: panel.onCard,
  });
  panel.attach(story);
  // ?kamera=a|b|c|d|eski: tıklamayla durağa geçiş biçimi (varsayılan A, doğrudan uçuş); ?demo=1 tıklamaları kendisi yapar
  const kamera = ['a', 'b', 'c', 'd', 'eski'].includes(params.get('kamera')) ? params.get('kamera') : 'a';
  function demoBaslat() { if (params.has('demo')) tur.demo(['cekmece', 'buzdolabi', 'modem', 'saksilar', 'klavye', null]); }
  tur = odaTuru(root, story, {
    duraklar: [null, ...ZONES.map((z) => z.id)],
    metin: { baslik: t('oda.tur.baslik'), basla: t('oda.tur.basla') },
    reduce, bekle: !!params.get('odak'), gecis: kamera,
  });
  if (hazir) { tur.hazir(); demoBaslat(); }
  // Yalnız laboratuvar (çekim için): ?bak=0.4 kenar bakışını o açıya çevirir (radyan, artı sola),
  // ?odak=cekmece açılışta o bölgeye yakınlaşır
  if (params.get('bak') && story.debug.look) story.debug.look.yaw = Number(params.get('bak'));
  if (params.get('odak')) story.focus(params.get('odak'));
  // ?adim=3: yakın plandaki bölgede o kadar şablon ilerler (çekim için; toz yazısı üçüncüde gelir)
  for (let i = 0; i < Number(params.get('adim') || 0) && story.focusedId; i++) {
    const z = story.focusedId;
    await story.api.show(z, story.api.current(z).index + 1, { reduced: true });
  }
  // Döngü düğmesi: turda sıradaki durağa (sondan başa); tur sürmüyorsa sıradaki bölgeye
  nextBtn.addEventListener('click', () => {
    const ids = ZONES.map((z) => z.id);
    if (story.driven) tur.ileri();
    else story.focus(ids[(ids.indexOf(story.focusedId) + 1) % ids.length]);
    if (!reduce) nextBtn.querySelector('svg').animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 520, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
  });
</script>
</body>
</html>
