<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SÇ3 Kahraman Kare · Oktos Workshop</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300..900&family=Caveat:wght@600&family=Schibsted+Grotesk:wght@400;600;700&display=swap">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/",
  "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/index.js",
  "gsap/": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/"
} }
</script>
<style>
  :root { --kagit: #f1ede6; --murekkep: #1d1d20; --vurgu: #bf5519; --vurgu-yazi: #94400f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--kagit); }
  #sahne { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--kagit); }
  /* Kamera grubu: kâğıt masa + gerçek nesneler (WebGL) ve doodle karakterler birlikte iter; yazı ve gren sabit */
  #kamera { position: absolute; left: 0; top: 0; transform-origin: 0 0; z-index: 1; }
  #kamera > canvas, #kamera > svg { position: absolute; left: 0; top: 0; }
  #kamera > svg { overflow: visible; }
  #yazi { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  #yazi .k { position: absolute; margin: 0; white-space: nowrap; color: var(--murekkep);
    font-family: 'Big Shoulders Display', sans-serif; text-transform: none; line-height: 1; }
  #sahne > .kagit-katman { position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none; }
  #hata { position: absolute; left: 18px; top: 14px; z-index: 30; font: 500 20px/1.3 ui-monospace, Consolas, monospace; color: #94400f; white-space: pre; }
</style>
</head>
<body data-sayfa="sc3">
<div id="sahne">
  <div id="kamera">
    <canvas id="gl"></canvas>
    <svg id="kisiler" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div id="yazi" aria-live="polite"></div>
  <div id="hata" aria-hidden="true"></div>
</div>
<script type="module" src="./sc3.js"></script>
</body>
</html>
