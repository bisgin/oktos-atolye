<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montaj Testi · Oktos Workshop</title>
<meta name="robots" content="noindex">
<script type="importmap">
{ "imports": {
  "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/index.js",
  "gsap/": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/"
} }
</script>
<style>
  :root { --kagit: #f1ede6; --murekkep: #1d1d20; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--kagit); }
  #sahne { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--kagit); }
  #sahne > svg.cizim { position: absolute; left: 0; top: 0; z-index: 1; overflow: visible; }
  #sahne > .kagit-katman { position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none; }
  #yazi { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .etiket { position: absolute; right: 18px; top: 14px; z-index: 30; font: 500 22px/1.3 ui-monospace, Consolas, monospace; color: var(--murekkep); background: rgba(241, 237, 230, 0.85); padding: 6px 10px; border-radius: 6px; border: 1px solid #c9c2b5; }
  #hata { position: absolute; left: 18px; top: 14px; z-index: 30; font: 500 20px/1.3 ui-monospace, Consolas, monospace; color: #94400f; white-space: pre; }
</style>
</head>
<body data-sayfa="montaj">
<div id="sahne">
  <div id="yazi"></div>
  <div id="hata" aria-hidden="true"></div>
</div>
<script type="module" src="./montaj.js"></script>
</body>
</html>
